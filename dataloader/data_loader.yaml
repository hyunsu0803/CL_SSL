train:

  # speech_dir: /root/clssl/SiTEC/
  # vad_dir: /root/clssl/SSL_src/prepared/vad/SiTEC/

  noise_dir: /root/clssl/MS-SNSD/
  metadata_dir: /root/clssl/SSL_src/metadata/

  speech_dir: /root/clssl/LibriSpeech/train-clean-100/
  vad_dir: /root/clssl/SSL_src/prepared/vad/train-clean-100/
  
  speech_csv: train_librispeech.csv
  noise_csv: train_noise.csv

  
  num_spk: 1  # for real DataLoader
  ans_azi: 0
  degree_resolution: 1

  dataloader_dict:
    batch_size: 32 
    shuffle: True
    num_workers: 0
    drop_last: True

  mic_type: miyungpa 
  mic_num: 4 
  max_n_mic: 4 
  max_spk: 1
  speech_least_chunk_size: 32000
  duration: 64000 # 4s

  SNR: [10, 40]
  spk_SNR: [-5, 5]
  white_noise_snr: [30, 70]
  normalize_factor: [0.004, 1.0]
 

  gpu_rir_characteristic: 
      
    rt60_bound: [0.4, 1.0]
    abs_weights_bound: [0.5, 1.0]
    room_sz_bound: [[25.0, 25.0, 6.0], [45.0, 45.0, 12.0]]
      
    azi_gap: 30

    mic:
      rotation: True
      mic_type: miyungpa
      mic_height: [0.7, 1.5]
      mic_from_wall: 1.2

    ref_vec: 0
    room:
      distance: [1, 10] # m
      azimuth: [0, 360, 1] # start, end, unit # degree
      elevation: [30, 110, 1]  
      

    gpu_rir_generate_dict: # input of gpu rir
      room_sz:
      beta:
      pos_src:
      pos_rcv:
      nb_img:
      Tmax:
      fs: 16000.0
      c: 343.0
      orV_rcv:
      mic_pattern: omni 


