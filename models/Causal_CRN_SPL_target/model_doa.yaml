name: Causal_CRN_SPL_target
degree_resolution: 1

ref_ch: 0

##### sigma
p: 0.707106781
wait_epoch: 0
sigma_start: [16.0, 6.0, 2.5]
sigma_end: 
  min: [16.0, 6.0, 2.5]
  max: [16.0, 6.0, 2.5]
  # min: [0.05]

sigma_rate: [-0.0, 0.0, 0.0]
sigma_update_method: 'add'

iter:
  update: False
  update_period: 200

epoch:
  update: True
  update_period: 1


FFT:
  win_len: 256
  win_inc: 128
  fft_len: 256

  vad_threshold: 0.6666

CRN:

  # input_audio_channel: 4
  input_cnn_channel: 


  CNN:
    layer_num: 4
    # kernel_size: [3,3] # F X T
    kernel_size: 3
    filter: 64

    max_pool:
      # kernel_size: [2,1]
      # stride: [2,1]
      kernel_size: 2
      stride: 2
  
  GRU:
    # input_size: 256
    input_size: 1024
    hidden_size: 256
    num_layers: 3
    batch_first: True
    dropout: 0.0
    bidirectional: False

  GRU_init:
    shape: [3, 1,  256]
    learnable: False
    
  